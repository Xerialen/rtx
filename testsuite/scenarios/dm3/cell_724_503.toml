schema = "rtx-scenario/1"
name = "cell_724_503"
map = "dm3"
kind = "goto"
category = "cellprov"
place = "SNG-låg → SNG-hyllan"
description = "Cell transition on the SNG ledge (724 -> 503) - upstream merge criterion."

[run]
start = [-288, 768, -16]
target = [-544, 864, 120]
attempts = 10
timeout_s = 12
pause_s = 0.5
arrive_box = 60
regoto_max = 6

# No [route] here, and that is not an omission. A cell probe asserts one
# navmesh cell transition — it IS the pair of cells, which is why it is an
# upstream merge criterion rather than a route someone runs. The waypoints on
# every other drill exist to stop an arrival that took a different path from
# counting; here there is no path to take a different version of, and a gate
# built from the cells would be built out of the very thing it is meant to
# check.

[threshold]
required = 10
