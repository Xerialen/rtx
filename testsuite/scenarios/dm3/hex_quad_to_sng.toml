schema = "rtx-scenario/1"
name = "hex_quad_to_sng"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "quad → SNG"
description = "(hex)quad-to-sng: anchored on the owner's own run of the route (5.95 s, peak 582 u/s, ending at sng@SNG). The bot has to arrive within 6.66 s to pass."

[run]
# Anchors and reference time come from (hex)quad-to-sng.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [936.8, 336.0, 56.0]
target = [-523.4, 453.2, 120.0]
attempts = 5
timeout_s = 24
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [528.9, 115.6, 94.9], box = 96, name = "ring" },
  { at = [346.6, 519.5, 98.5], box = 96, name = "lifts under" },
  { at = [-90.9, 779.1, 120.0], box = 96, name = "SNG hyllan" },
]

[threshold]
required = 4
reference_time_s = 5.95
max_time_s = 6.66
