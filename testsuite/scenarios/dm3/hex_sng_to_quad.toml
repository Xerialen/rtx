schema = "rtx-scenario/1"
name = "hex_sng_to_quad"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "SNG → quad"
description = "(hex)sng-to-quad: anchored on the owner's own run of the route (6.30 s, peak 671 u/s, ending at quad@Quad). The bot has to arrive within 7.05 s to pass."

[run]
# Anchors and reference time come from (hex)sng-to-quad.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [-518.6, 493.6, 120.0]
target = [936.8, 336.0, 56.0]
attempts = 5
timeout_s = 26
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [-356.8, 275.0, 140.9], box = 96, name = "SNG" },
  { at = [384.5, 633.4, 96.1], box = 96, name = "lifts under" },
  { at = [527.2, 109.0, 91.0], box = 96, name = "ring" },
]

[threshold]
required = 4
reference_time_s = 6.3
max_time_s = 7.05
