schema = "rtx-scenario/1"
name = "highbridge_to_rl"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "bridge hög → RL"
description = "highbridge-to-rl: anchored on the owner's own run of the route (3.09 s, peak 548 u/s, ending at rl@RL). The bot has to arrive within 3.46 s to pass."

[run]
# Anchors and reference time come from highbridge-to-rl.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [1358.9, -347.8, -24.0]
target = [1647.0, 491.5, -88.0]
attempts = 5
timeout_s = 15
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [1316.0, -2.5, -24.0], box = 96, name = "bridge hög" },
  { at = [1538.2, 202.1, 19.0], box = 96, name = "window" },
]

[threshold]
required = 4
reference_time_s = 3.09
max_time_s = 3.46
