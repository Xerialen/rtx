schema = "rtx-scenario/1"
name = "lg_to_pent_to_pentmega"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "water LG → pent"
description = "lg-to-pent-to-pentmega: anchored on the owner's own run of the route (10.65 s, peak 586 u/s, ending at mh@Pent). The bot has to arrive within 11.93 s to pass."

[run]
# Anchors and reference time come from lg-to-pent-to-pentmega.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [1551.1, -194.1, -392.0]
target = [1865.8, 631.2, -180.0]
attempts = 5
timeout_s = 40
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [1296.8, 719.2, -360.0], box = 96, name = "pent" },
  { at = [972.2, 1002.0, -261.0], box = 96, name = "pent 2" },
]

[threshold]
required = 4
reference_time_s = 10.65
max_time_s = 11.93
