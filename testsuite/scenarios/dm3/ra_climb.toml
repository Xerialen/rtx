schema = "rtx-scenario/1"
name = "ra_climb"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "RA-ingången → RA-plattan (uppför trapporna)"
description = "Climb from the floor by the RA stairs to the RA platform (z=328) without falling."

[run]
start = [464, -488, 56]
target = [256, -704, 328]
attempts = 10
timeout_s = 30
pause_s = 1.0
arrive_box = 70
regoto_max = 6      # workaround for the goto crossed-finish bug

[fail.fall_gate]
armed_z = 140       # once the bot has been above this...
fail_z = 70         # ...dropping below this counts as a fall

[threshold]
required = 10       # of attempts
