schema = "rtx-scenario/1"
name = "ralow_to_ratop"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "RA låg → RA"
description = "ralow-to-ratop: anchored on the owner's own run of the route (7.78 s, peak 538 u/s, ending at ra@RA). The bot has to arrive within 8.71 s to pass."

[run]
# Anchors and reference time come from ralow-to-ratop.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [-12.5, -574.1, -16.0]
target = [272.6, -682.0, 328.0]
attempts = 5
timeout_s = 31
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [495.5, -813.9, 56.0], box = 96, name = "RA låg" },
  { at = [31.6, -879.6, 152.0], box = 96, name = "RA" },
  { at = [285.5, -879.9, 264.0], box = 96, name = "RA 2" },
  { at = [46.0, -603.8, 341.6], box = 96, name = "RA 3" },
]

[threshold]
required = 4
reference_time_s = 7.78
max_time_s = 8.71
