schema = "rtx-scenario/1"
name = "ring_to_ratop"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "RA ingången → RA"
description = "ring-to-ratop: anchored on the owner's own run of the route (7.52 s, peak 527 u/s, ending at ra@RA). The bot has to arrive within 8.42 s to pass."

[run]
# Anchors and reference time come from ring-to-ratop.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [494.2, -384.6, 56.0]
target = [241.5, -698.4, 328.0]
attempts = 5
timeout_s = 30
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [72.2, -573.2, 152.0], box = 96, name = "RA" },
  { at = [31.9, -877.6, 152.0], box = 96, name = "RA 2" },
  { at = [303.0, -870.6, 264.0], box = 96, name = "RA 3" },
  { at = [48.9, -563.2, 321.8], box = 96, name = "RA 4" },
]

[threshold]
required = 4
reference_time_s = 7.52
max_time_s = 8.42
