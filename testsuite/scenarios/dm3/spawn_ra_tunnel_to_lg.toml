schema = "rtx-scenario/1"
name = "spawn_ra_tunnel_to_lg"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "RA tunneln → water LG"
description = "(spawn)ra-tunnel-to-lg: anchored on the owner's own run of the route (5.05 s, peak 618 u/s, ending at lg@water.LG). The bot has to arrive within 5.66 s to pass."

[run]
# Anchors and reference time come from (spawn)ra-tunnel-to-lg.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [192.0, -207.0, -176.0]
target = [1562.0, -189.2, -392.0]
attempts = 5
timeout_s = 21
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [786.4, 172.2, -123.9], box = 96, name = "hill" },
  { at = [1109.8, -53.9, -138.2], box = 96, name = "bridge låg" },
]

[threshold]
required = 4
reference_time_s = 5.05
max_time_s = 5.66
