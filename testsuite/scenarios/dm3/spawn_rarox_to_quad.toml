schema = "rtx-scenario/1"
name = "spawn_rarox_to_quad"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "SNG tele → quad"
description = "(spawn)rarox-to-quad: anchored on the owner's own run of the route (3.79 s, peak 568 u/s, ending at quad@Quad). The bot has to arrive within 4.25 s to pass."

[run]
# Anchors and reference time come from (spawn)rarox-to-quad.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [-632.0, -680.5, -16.0]
target = [946.4, 333.5, 56.0]
attempts = 5
timeout_s = 17
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [-612.9, -457.5, 27.5], box = 96, name = "SNG tele" },
  { at = [423.8, -225.4, 56.0], box = 96, name = "ring" },
  { at = [847.1, -166.2, 99.0], box = 96, name = "quad" },
]

[threshold]
required = 4
reference_time_s = 3.79
max_time_s = 4.25
