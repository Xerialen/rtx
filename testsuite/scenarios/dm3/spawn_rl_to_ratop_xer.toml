schema = "rtx-scenario/1"
name = "spawn_rl_to_ratop_xer"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "RL → RA"
description = "(spawn)rl-to-ratop-xer: anchored on the owner's own run of the route (14.51 s, peak 687 u/s, ending at ra@RA). The bot has to arrive within 16.25 s to pass."

[run]
# Anchors and reference time come from (spawn)rl-to-ratop-xer.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [1488.0, 436.6, -88.0]
target = [279.8, -672.0, 328.0]
attempts = 5
timeout_s = 53
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [1572.9, -82.4, -158.2], box = 128, name = "bridge låg" },
  { at = [202.2, -99.2, -176.0], box = 96, name = "RA tunneln" },
  { at = [-196.9, -222.5, -166.2], box = 96, name = "RA tunneln 2" },
  { at = [-35.0, -725.5, 7.2], box = 96, name = "RA låg" },
]

[threshold]
required = 4
reference_time_s = 14.51
max_time_s = 16.25
