schema = "rtx-scenario/1"
name = "window_to_rl"
map = "dm3"
kind = "goto"
category = "grunddrill"
place = "window → RL"
description = "window-to-rl: anchored on the owner's own run of the route (3.12 s, peak 620 u/s, ending at rl@RL). The bot has to arrive within 3.49 s to pass."

[run]
# Anchors and reference time come from window-to-rl.qwd via the owner's route
# manifest (see scenarios/dm3/routes-v1.json).
start = [1295.9, 445.5, 56.0]
target = [1674.2, 460.9, -88.0]
attempts = 5
timeout_s = 15
pause_s = 1.0
arrive_box = 70
regoto_max = 6

[route]
# Ordered waypoints the attempt must pass through, in this order,
# before an arrival counts. Anchored on the owner's own run of the
# route: points he actually occupied, in the order he occupied
# them, at the places his path genuinely departs from a straight
# line to the target — never points derived from the navmesh or
# from geometry.
via = [
  { at = [1243.1, 393.8, 56.0], box = 96, name = "window" },
  { at = [1458.5, 56.5, -17.4], box = 96, name = "bridge hög" },
]

[threshold]
required = 4
reference_time_s = 3.12
max_time_s = 3.49
